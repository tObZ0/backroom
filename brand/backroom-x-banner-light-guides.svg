<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <radialGradient id="room" cx="70%" cy="50%" r="80%">
      <stop offset="0" stop-color="#f4eee1"/><stop offset=".55" stop-color="#ece5d3"/><stop offset="1" stop-color="#d9cfb8"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d81f33"/><stop offset=".55" stop-color="#b8152a"/><stop offset="1" stop-color="#a3121f"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4142a" stop-opacity=".42"/><stop offset=".5" stop-color="#c4142a" stop-opacity=".16"/><stop offset="1" stop-color="#c4142a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d81f33" stop-opacity=".22"/><stop offset="1" stop-color="#d81f33" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur16" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .29  0 0 0 0 .2  0 0 0 .6 0"/>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#room)"/>
  <!-- the floor, a touch deeper than the wall, and the seam between them -->
  <rect x="0" y="420" width="1500" height="80" fill="#e2d9c4"/>
  <rect x="0" y="420" width="1500" height="2" fill="#1b1815" opacity=".55"/>

  <!-- the crimson light, warming the wall and washing across the floor -->
  <ellipse cx="1105" cy="263.2" rx="260" ry="230" fill="url(#halo)" filter="url(#blur40)"/>
  <path d="M1096.2 420 L1174.6 420 L1294.6 500 L576.2 500 Z" fill="url(#spill)" filter="url(#blur16)"/>
  <!-- the logo casts a soft shadow onto the floor behind the light -->
  <ellipse cx="1085" cy="426" rx="168" ry="10" fill="#1b1815" opacity=".18" filter="url(#blur16)"/>

  <!-- the original logo -->
  <rect x="961.8" y="117.6" width="246.39999999999998" height="302.4" fill="#1b1815"/>
  <rect x="1096.2" y="151.2" width="78.39999999999999" height="268.79999999999995" fill="url(#panel)"/>
  <path d="M995.4 151.2 L1096.2 162.4 L1096.2 408.8 L995.4 420.0 Z" fill="#ece5d3"/>
  <rect x="1065.4" y="274.4" width="14.559999999999999" height="14.559999999999999" fill="#1b1815"/>
  <rect x="928.2" y="408.8" width="313.59999999999997" height="16.799999999999997" fill="#1b1815"/>

  <text x="118" y="236" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="64" letter-spacing="15" fill="#1b1815">BACKROOM</text>
  <rect x="122" y="262" width="56" height="2.5" fill="#a3121f"/>
  <text x="120" y="304" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#5a5246">What are you bringing inside?</text>

  <rect width="1500" height="500" filter="url(#grain)" opacity=".12"/>
  <circle cx="206" cy="500" r="168" fill="rgba(0,120,255,.25)" stroke="#2f8cff" stroke-width="3"/>
  <rect x="0" y="0" width="1500" height="60" fill="rgba(0,0,0,.08)"/><rect x="0" y="440" width="1500" height="60" fill="rgba(0,0,0,.08)"/>
</svg>