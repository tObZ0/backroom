  <path d="M1102.2 420 L1168.6 420 L1214.6 466 L946.2 466 Z" fill="#ff3a4a" opacity=".35" filter="url(#blur16)"/>
  <path d="M1096.2 151.2 L1174.6 151.2 L1264.6 500 L626.2 500 Z" fill="url(#beam)" filter="url(#blur16)"/>

  <!-- the logo -->
  
  <rect x="961.8" y="117.6" width="246.39999999999998" height="302.4" fill="#efe3cf"/>
  <rect x="1096.2" y="151.2" width="78.39999999999999" height="268.79999999999995" fill="url(#panel)"/>
  <path d="M995.4 151.2 L1096.2 162.4 L1096.2 408.8 L995.4 420.0 Z" fill="#2a1b1a"/>
  <rect x="1065.4" y="274.4" width="14.559999999999999" height="14.559999999999999" fill="#efe3cf"/>
  <rect x="928.2" y="408.8" width="313.59999999999997" height="16.799999999999997" fill="#efe3cf"/>
  <!-- the crimson panel glows -->
  <rect x="1096.2" y="151.2" width="78.39999999999999" height="268.79999999999995" fill="#ff5a6a" opacity=".4" filter="url(#blur16)"/>
  

